name: test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [18, 22]
        exclude:
          - os: macos-latest
            node: 18
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: ${{ matrix.node == 22 && 'npm' || '' }}
      - name: Test the dependency-free runtime
        if: matrix.node == 18
        shell: bash
        run: |
          shopt -s extglob
          node --test tests/!(installer|package).test.mjs
      - if: matrix.node == 22
        run: npm ci --ignore-scripts
      - if: matrix.node == 22
        run: npm test
